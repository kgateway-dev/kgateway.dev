name: Docs UI Screenshots

# Captures the third-party UIs our guides walk readers through (today: the Keycloak admin
# console) and keeps the published images in step with the specs.
#
# Two behaviors, deliberately different:
#   pull_request        — capture and DIFF against the committed baselines. A drift fails the
#                         job, because it means either the spec changed the UI state or somebody
#                         bumped a version without regenerating. The HTML report, with image
#                         diffs, is uploaded so the reviewer can see what moved.
#   push / dispatch     — REGENERATE the baselines on Linux and open a PR if the pixels changed.
#                         CI on Linux owns the canonical set: font anti-aliasing differs from
#                         macOS, so a locally generated commit would show a whole-image diff.
#
# There is no schedule on purpose. The Keycloak version is pinned to an exact tag declared by the
# docs themselves (assets/kgw-docs/versions/keycloak-version.md), so the captured pixels cannot
# change unless a file in this repo changes. A cron would spend CI minutes re-proving the same
# bytes. See playwright/README.md § "Why provision, and why no cron".

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "playwright/**"
      - "assets/kgw-docs/versions/keycloak-version.md"
      - ".github/workflows/screenshots.yml"
  push:
    branches:
      - main
    paths:
      - "playwright/**"
      - "assets/kgw-docs/versions/keycloak-version.md"
      - ".github/workflows/screenshots.yml"

# The regenerate path commits images and opens a PR, so it needs write access. The pull_request
# path only reads, but permissions are declared per workflow rather than per step.
permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # On a pull request, diff against the committed baselines. This is the regression gate.
      - name: Capture and diff screenshots
        if: github.event_name == 'pull_request'
        run: npm run capture:all

      # Anywhere else, regenerate. CI on Linux is the source of truth for the pixels.
      - name: Regenerate screenshots
        if: github.event_name != 'pull_request'
        run: npm run update:all

      - name: Publish captures into the docs image tree
        if: github.event_name != 'pull_request'
        run: npm run sync-docs

      # Confirm the published copies match the baselines even on a PR, so a spec change that
      # forgets `npm run sync-docs` cannot merge with stale images in assets/img/.
      - name: Verify published images match the baselines
        if: github.event_name == 'pull_request'
        run: npm run sync-docs -- --check

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: playwright-report
          path: |
            playwright/playwright-report
            playwright/test-results
          retention-days: 14

      - name: Open a pull request if the images changed
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: refresh generated UI screenshots"
          signoff: true
          branch: automation/refresh-screenshots
          delete-branch: true
          title: "Refresh generated UI screenshots"
          body: |
            🖼️ **Automated screenshot refresh**

            Regenerated by the `Docs UI Screenshots` workflow on Linux, which owns the canonical
            baselines. Only opened because the captured pixels changed.

            **Review the image diffs rather than just merging.** A changed screenshot usually
            means the third-party UI changed, which often means the guide's click-path prose is
            now wrong too — renamed buttons and moved fields are exactly what this catches. Fixing
            the prose is the part that matters; the pixels are the easy half.

            The captured Keycloak version is whatever
            `assets/kgw-docs/versions/keycloak-version.md` declares, which is the same file the
            guide's YAML renders.
