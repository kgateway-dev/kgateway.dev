# Offline build: a copy of the site that loads nothing from another host, for
# readers on an air-gapped network. Layered on top of hugo.yaml, never used on
# its own:
#
#   make build-offline        # or: hugo160 --gc --minify --config hugo.yaml,hugo-offline.yaml
#
# The public site never reads this file, so nothing here changes it.
#
# hugo.yaml already sets `baseURL: "/"`, so the build serves from the root of
# whatever host it lands on. It does NOT work from a subpath
# (intranet.example.com/kgateway/): `canonifyURLs` makes every link
# root-absolute.

params:
  # Read by docs-theme-extras and by this repo's head-end.html and footer.html.
  # Swaps Google Fonts for bundled fonts, drops the Scarf pixel and the
  # "Open in Claude/ChatGPT/Perplexity" and docs MCP menu items, and fails the
  # build if the FlexSearch bundle cannot be fetched at build time.
  offline: true

  # The "Was this page helpful?" widget files a GitHub issue, which an
  # air-gapped reader cannot reach.
  feedback:
    enable: false

  # Figtree, the heading font, is this repo's own (the module bundles the
  # brand font, Open Sans). Files and licence: assets/fonts/offline/.
  offlineFonts:
    - family: Figtree
      style: normal
      weight: "300 900"
      files:
        - path: fonts/offline/figtree-latin-ext-wght-normal.woff2
          unicodeRange: "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"
        - path: fonts/offline/figtree-latin-wght-normal.woff2
          unicodeRange: "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"
    - family: Figtree
      style: italic
      weight: "300 900"
      files:
        - path: fonts/offline/figtree-latin-ext-wght-italic.woff2
          unicodeRange: "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"
        - path: fonts/offline/figtree-latin-wght-italic.woff2
          unicodeRange: "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

# Hextra renders the Google Analytics tag only when this ID is set.
services:
  googleAnalytics:
    ID: ""
