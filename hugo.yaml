baseURL: "/"

# The `book` output format that drives the PDF export is NOT declared here.
# docs-theme-extras declares it in its own hugo.toml and Hugo merges a module's
# top-level `outputFormats` into the importing project, so importing the module
# is enough. This file used to carry a copy; it was removed once the module
# owned it, so there is one place to change it rather than one per consumer.
#
# That merge only happens on the default config lookup, which is what this repo
# uses. A build that passes `--config` replaces the lookup and would need its own
# copy — this repo has no such build.
#
# The version label on the cover and in the running footer is resolved per tree
# by the module's utils/book-version.html, from the `params.versions` entry whose
# `linkVersion` matches the tree the book walked. An earlier comment here warned
# that the label was global and therefore wrong on a versioned site; that is no
# longer true.
enableRobotsTXT: true
# Derive each page's .Lastmod from its last git commit — no manually maintained
# front-matter dates. Feeds the sitemap <lastmod> for SEO. Listing "lastmod"
# before ":git" keeps an explicit front-matter date ahead of the commit date
# where a page sets one.
enableGitInfo: true
frontmatter:
  lastmod: ["lastmod", ":git", "date", "publishDate"]
canonifyURLs: true
title: "kgateway"

services:
  googleAnalytics:
    ID: "G-9P21XPDJPX"

outputs:
  home: [HTML, RSS, llms]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown, llms]

defaultContentLanguage: en

module:
  imports:
    # hextra used to live here as a sibling import; docs-theme-extras
    # now declares the hextra import itself, so consumers no longer
    # need to list it separately. The shadowing order stays correct:
    # docs-theme-extras's own layouts win over the transitively-imported
    # hextra ones.
    - path: github.com/solo-io/docs-theme-extras
  mounts:
    - source: "assets"
      target: "assets"
    - source: "fonts"
      target: "static/fonts"
    - source: "hugo_stats.json"
      target: "assets/watching/hugo_stats.json"

caches:
  getresource:
    dir: ":cacheDir/:project"
    maxAge: 1h  # Cache remote resources for 1 hour to balance freshness and build speed

build:
  writeStats: true
  cachebusters:
    - source: "assets/watching/hugo_stats\\.json"
      target: "styles\\.css"
    - source: "(postcss|tailwind)\\.config\\.js"
      target: "css"
    - source: "assets/.*\\.(js|ts|jsx|tsx)"
      target: "js"
    - source: "assets/.*\\.(.*)$"
      target: "$1"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

enableInlineShortcodes: true

menu:
  main:
    - name: Resources
      url: /resources
      weight: 1
    - name: Blog
      url: /blog
      weight: 2
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 10
      url: "https://github.com/kgateway-dev/kgateway"
      params:
        icon: github

params:
  description: Kgateway is a feature-rich, fast, and flexible API gateway that is built on top of Envoy proxy and the Kubernetes Gateway API. It excels in function-level routing, supports legacy apps, microservices and serverless, offers robust discovery capabilities, integrates seamlessly with open-source projects, and is designed to support hybrid applications with various technologies, architectures, protocols, and clouds.

  # Default social-share image for OpenGraph / Twitter cards (og:image),
  # emitted by Hextra's opengraph.html and docs-theme-extras' twitter_cards.html.
  # Requires a raster card committed at static/ogimage.png (agw-oss uses a
  # 1280x720 PNG). Until that asset exists this points at a 404 and no card
  # image is shown.
  images:
    - /ogimage.png

  # Tells docs-theme-extras which brand CSS layer + font stack to load
  # (see the module's layouts/partials/themeExtras/head-end.html). "oss"
  # loads brand-oss.css and Open Sans; "enterprise" loads brand-enterprise.css.
  themeExtras:
    brand: oss
    # Canonical production host (scheme + hostname, no trailing slash, no path).
    # Read by the docs-theme-extras module's `utils/prod-host` partial and reused
    # across layouts (copy-markdown, llms.txt, page-to-markdown) that emit
    # absolute URLs which need to resolve when pasted outside the build's
    # preview URL. Set explicitly here because kgw-oss's prod baseURL doesn't
    # include the host.
    prodHost: "https://kgateway.dev"

  # "Download all docs (PDF)" in the Copy-as-Markdown menu, added by the module's
  # copy-markdown.html. Setting `distribution` is what turns the item on and
  # selects the solo-io/docs-pdfs release-asset URL shape, which the module
  # supplies so it is not repeated per consumer:
  #
  #   .../releases/download/{product}-{distribution}-{version}/{product}-{distribution}-{version}.pdf
  #
  # `oss` is the segment that keeps this asset off the enterprise kgateway docs'
  # asset of the same product name. The tags differ in both segments today
  # (kgateway-oss-envoy-latest vs kgateway-enterprise-2.3.x), but publishing uses
  # --clobber, so a collision would overwrite rather than fail — the distribution
  # segment is the thing that makes a collision impossible rather than unlikely.
  #
  # `product` is set explicitly because it is otherwise read from
  # `params.currentProduct` or `params.folder`, and this site sets neither: the
  # resolved name would be empty and the URL would come out as `-oss-envoy-latest`.
  #
  # `{version}` resolves to `envoy-latest` rather than `latest`, because `envoy` is
  # a registered key in `params.sections` below and the module prefixes the version
  # segment with the section segment when one applies. solo-io/docs's pdf-export.yml
  # derives its release tag from the same `envoy/latest` path, so the link and the
  # published asset agree by construction rather than by being kept in step.
  #
  # The item renders only on a version tree that builds a book, because it asks the
  # version root for its output formats — so /2.3.x/ and /main/ do not show it.
  pdfDownload:
    distribution: oss
    product: kgateway

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: /logo.svg
      dark: /logo-dark.svg
      link: /
      width: 494
      height: 100
    width: wide

  page:
    width: wide

  theme:
    default: light
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: normal

  # Suppress the visible "Last updated on <date>" footer. Page .Lastmod still
  # feeds the sitemap <lastmod> (SEO); we just don't show the date in the footer.
  displayUpdatedDate: false
  dateFormat: "January 2, 2006"

  # Search
  # flexsearch is enabled by default
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      # `content` indexes the full body keyed by heading anchors, so users
      # can find terms anywhere on a page (not just in the description) and
      # results link directly to the matching section.
      index: content

  editURL:
    enable: false

  feedback:
    enable: true
    issueRepo: kgateway-dev/kgateway.dev

  llms:
    docsIntro: kgateway is a Kubernetes-native Gateway API implementation built on Envoy with AI gateway capabilities.

  blog:
    list:
      displayTags: true

  comments:
    enable: false
    type: giscus

    giscus:
      repo: imfing/hextra
      repoId: 
      category: General
      categoryId: 

  searchbot:
    urls:
      websites: https://searchbot.tryhelix.ai/
      bots: https://searchbot.tryhelix.ai/bots
  
  # THE version list — the only one. Newest first. Every entry names the
  # sections it applies to. The contract, in full, with a TOML and a YAML
  # template: docs-theme-extras USAGE.md, "Versions and sections".
  #
  # Also consumed by this repo's local partials (404.html, navbar.html,
  # navbar-version.html, breadcrumb.html).
  versions:
    - version: "2.5.x"
      sections: ["envoy"]
      dropdown: "main"
      linkVersion: "main"
    - version: "2.4.x"
      sections: ["envoy"]
      dropdown: "2.4 (latest)"
      linkVersion: "latest"
    - version: "2.3.x"
      sections: ["envoy"]
      dropdown: "2.3"
      # NOTE: this says linkVersion "2.3.x", so it is NOT the entry
      # version-noindex treats as current — that is the 2.4.x entry above,
      # whose linkVersion IS "latest". So /latest/ stays indexable and
      # duplicate pages under /main/, /2.3.x/, /2.2.x/ and /2.1.x/ are
      # noindexed. An earlier comment here claimed the opposite; left as-is
      # behaviorally, since which version should be canonical is a kgateway
      # release decision rather than a config typo.
      linkVersion: "2.3.x"
    - version: "2.2.x"
      sections: ["envoy"]
      dropdown: "2.2"
      linkVersion: "2.2.x"
    - version: "2.1.x"
      sections: ["envoy"]
      dropdown: "2.1"
      linkVersion: "2.1.x"

  # Section registry, alphabetical. A section exists because it is a key here.
  # See docs-theme-extras USAGE.md, "Versions and sections".
  sections:
    # No content anywhere in this repo — there is no /docs/agentgateway/ tree,
    # so `externalURL` is what the section selector points at. That is the
    # documented shape for a section that exists only to send readers to
    # another product. It is tagged on no version entry above, so it offers no
    # versions of its own, which is correct: it has no version trees.
    agentgateway:
      externalURL: "https://agentgateway.dev/docs/kubernetes/latest/"

    envoy: {}
